name: 不具合報告
description: 再現可能な不具合や意図しない動作を報告します
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。セキュリティ脆弱性は、このフォームではなくSecurity Advisoryから非公開で報告してください。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きているかを簡潔に記載してください。
      placeholder: 例：タスクをclaimした直後に取得すると、変更前の担当者が返される
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 最小限の文書例や操作手順を番号付きで記載してください。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: エラーメッセージ、診断内容、スクリーンショットなどがあれば添付してください。
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: agent-tasksのバージョンまたはコミット
      placeholder: 例：0.1.0、main@abcdef0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 実行環境
      description: OS、Node.jsなど、問題に関係する環境を記載してください。
      placeholder: 例：Windows 11、Node.js 24

  - type: textarea
    id: additional-context
    attributes:
      label: 補足
      description: 原因の見当、関連Issue、回避策などがあれば記載してください。

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 既存のIssueに同じ内容がないことを確認しました。
          required: true
        - label: この報告に秘密情報や個人情報を含めていません。
          required: true
