name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    if: github.repository == 'haiix/agent-tasks'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        run: >-
          node -e "const expected = 'v' + require('./package.json').version;
          if (process.env.RELEASE_TAG !== expected) {
          throw new Error('Release tag ' + process.env.RELEASE_TAG +
          ' does not match package version ' + expected); }"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Verify source and package
        run: npm run check

      - name: Configure initial-publish token
        run: |
          if [ -n "$INITIAL_NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$INITIAL_NPM_TOKEN"
          fi
        env:
          INITIAL_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish package
        run: npm publish --access public --provenance
